<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Desk Lamp">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecf0fc"/><stop offset="1" stop-color="#c8d4f5"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".85"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- desk surface -->
  <rect x="0" y="486" width="600" height="114" fill="#b9c6ec" opacity=".55"/>
  <ellipse cx="270" cy="490" rx="130" ry="12" fill="#1f2a44" opacity=".2"/>
  <!-- light beam -->
  <g transform="translate(398 206) rotate(20)">
    <path d="M-78 66 L78 66 L190 300 L-190 300 Z" fill="url(#beam)"/>
  </g>
  <!-- base -->
  <rect x="180" y="462" width="180" height="26" rx="13" fill="#2d3748"/>
  <rect x="196" y="466" width="148" height="6" rx="3" fill="#fff" opacity=".14"/>
  <!-- arms -->
  <path d="M268 464 L226 314" stroke="#4a5568" stroke-width="13" stroke-linecap="round"/>
  <path d="M226 314 L392 214" stroke="#4a5568" stroke-width="13" stroke-linecap="round"/>
  <circle cx="268" cy="462" r="15" fill="#2d3748"/>
  <circle cx="226" cy="314" r="14" fill="#2d3748"/>
  <circle cx="226" cy="314" r="5" fill="#a0aec0"/>
  <!-- head -->
  <g transform="translate(398 206) rotate(20)">
    <path d="M-62 4 Q-62 -44 0 -48 Q62 -44 62 4 L84 66 L-84 66 Z" fill="url(#shade)"/>
    <ellipse cx="0" cy="66" rx="84" ry="10" fill="#fff4c2"/>
    <ellipse cx="0" cy="64" rx="44" ry="6" fill="#fff" opacity=".9"/>
    <path d="M-40 -22 Q-48 10 -62 44" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="7" stroke-linecap="round"/>
  </g>
  <circle cx="392" cy="214" r="10" fill="#2d3748"/>
</svg>

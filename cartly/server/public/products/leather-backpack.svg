<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Leather Backpack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f1e7"/><stop offset="1" stop-color="#e6d3b8"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b5733f"/><stop offset="1" stop-color="#7a4624"/></linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a5e32"/><stop offset="1" stop-color="#84501f"/></linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="490" rx="170" ry="15" fill="#4a2a12" opacity=".18"/>
  <!-- top handle -->
  <path d="M268 172 Q268 120 300 120 Q332 120 332 172" fill="none" stroke="#5a3318" stroke-width="13" stroke-linecap="round"/>
  <!-- side pockets -->
  <rect x="146" y="346" width="48" height="112" rx="18" fill="#7a4624"/>
  <rect x="406" y="346" width="48" height="112" rx="18" fill="#7a4624"/>
  <!-- main body -->
  <path d="M170 262 Q170 160 300 160 Q430 160 430 262 L430 438 Q430 484 388 484 L212 484 Q170 484 170 438 Z" fill="url(#body)"/>
  <!-- top zip seam -->
  <path d="M196 252 Q300 208 404 252" fill="none" stroke="#e9c97c" stroke-width="3.5" stroke-dasharray="3 7" stroke-linecap="round"/>
  <path d="M196 260 Q300 216 404 260" fill="none" stroke="#5a3318" stroke-width="3" opacity=".6"/>
  <!-- front pocket -->
  <rect x="198" y="318" width="204" height="142" rx="30" fill="#8d542a"/>
  <rect x="198" y="296" width="204" height="86" rx="30" fill="url(#flap)"/>
  <rect x="206" y="304" width="188" height="70" rx="24" fill="none" stroke="#e9c97c" stroke-width="2.5" stroke-dasharray="4 6" stroke-linecap="round" opacity=".9"/>
  <!-- strap + buckle -->
  <rect x="286" y="372" width="28" height="56" rx="7" fill="#4d2b14"/>
  <rect x="280" y="394" width="40" height="30" rx="6" fill="none" stroke="#e8c36a" stroke-width="5"/>
  <!-- highlight -->
  <path d="M190 280 Q186 380 196 450" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="10" stroke-linecap="round"/>
</svg>
